<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Profil - TRIPATI DPPI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
        --bg-main: #07070F;
        --bg-card: #12121C;
        --bg-item: #1C1C28;
        --color-primary: #7C3AED; 
        --color-primary-hover: #6D28D9;
        --text-muted: #64748b;
    }

    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--bg-main); 
      color: #ffffff;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px;
      background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.15) 0%, transparent 60%);
      background-repeat: no-repeat;
    }

    .dashboard-card { 
      background: var(--bg-card);
      padding: 40px; 
      border-radius: 32px; 
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
      width: 100%;
      max-width: 500px; 
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      text-align: center;
    }

    .logo-image {
      height: 80px;
      width: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.1);
      padding: 2px;
      background-color: var(--bg-card);
      margin-bottom: 20px;
    }

    h1 { margin: 0 0 4px 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { color: var(--text-muted); margin: 0; font-size: 14px; font-weight: 500; }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }
    
    .data-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-radius: 20px;
      background: var(--bg-item);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    
    .data-item:hover {
      border-color: rgba(124, 58, 237, 0.3);
      background: #232332;
    }

    .data-label { 
      font-size: 13px;
      font-weight: 500; 
      color: var(--text-muted); 
    }
    
    .data-value { 
      color: #fff; 
      font-weight: 600;
      font-size: 14px;
      text-align: right;
    }

    #userPasswordInput {
      background-color: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-align: right;
      width: 140px;
      pointer-events: none;
      letter-spacing: 2px;
    }
    
    .status-badge {
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 12px;
    }
    .status-pending { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; }
    .status-verified { background-color: rgba(16, 185, 129, 0.1); color: #34d399; }

    .toggle-btn {
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--text-muted); transition: color 0.2s ease; margin-left: 8px;
    }
    .toggle-btn:hover { color: #fff; }
    
    .logout-button { 
      background: transparent;
      color: #f87171; 
      padding: 16px; 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      border-radius: 100px; 
      cursor: pointer; 
      font-size: 14px; 
      font-weight: 600; 
      transition: all 0.2s ease;
      width: 100%;
      text-align: center;
    }
    
    .logout-button:hover { 
      background: rgba(239, 68, 68, 0.1); 
      border-color: #ef4444;
    }

    @media (max-width: 480px) {
      .dashboard-card { padding: 30px 20px; }
      .data-item { flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; }
      .data-value { width: 100%; text-align: left; }
      #userPasswordInput { text-align: left; width: 100%; }
      .password-row { display: flex; width: 100%; justify-content: space-between; align-items: center;}
    }
  </style>
</head>
<body onload="loadUserDetails()">

<div class="dashboard-card">
  
  <div class="profile-header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png" alt="Logo DPPI" class="logo-image" onerror="this.src='https://placehold.co/100/12121C/FFFFFF?text=DPPI';">
      <h1 id="pageTitle">Memuat Data...</h1>
      <p class="subtitle">Akun Resmi TRIPATI DPPI</p>
  </div>

  <div class="data-list" id="userDetails">
    
    <div class="data-item">
        <span class="data-label">Status Seleksi</span>
        <div id="userStatus" class="data-value"><span class="status-badge status-pending">Memuat...</span></div>
    </div>
    
    <div class="data-item">
        <span class="data-label">Nomor Induk Kependudukan</span>
        <span id="userNik" class="data-value">Memuat...</span>
    </div>

    <div class="data-item">
        <span class="data-label">Nama Lengkap</span>
        <span id="userName" class="data-value">Memuat...</span>
    </div>
    
    <div class="data-item">
        <span class="data-label">Asal Instansi / Sekolah</span>
        <span id="userSekolah" class="data-value">Memuat...</span>
    </div>

    <div class="data-item">
        <span class="data-label">Nomor Kontak WhatsApp</span>
        <span id="userTelepon" class="data-value">Memuat...</span>
    </div>

    <div class="data-item">
        <span class="data-label">Kata Sandi Keamanan</span>
        <div class="password-row flex items-center">
            <input type="password" id="userPasswordInput" value="Memuat..." readonly/>
            <button class="toggle-btn" onclick="togglePasswordVisibility()" aria-label="Lihat Sandi">
                <svg id="toggleIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                </svg>
            </button>
        </div>
    </div>
  </div>
  
  <button class="logout-button" onclick="redirectToLogin()">
      Keluar dari Akun
  </button>
  
  <div id="messageArea" class="text-red-400 text-center mt-4 text-sm font-medium"></div>
</div>

<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('userPasswordInput');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
    } else {
        passwordInput.type = 'password';
        toggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>`;
    }
  }

  function loadUserDetails() {
    const messageArea = document.getElementById('messageArea');
    const passwordInput = document.getElementById('userPasswordInput');
    const userStatusElement = document.getElementById('userStatus');
    const userDataString = sessionStorage.getItem('userData'); 
    
    if (userDataString) {
      try {
          const user = JSON.parse(userDataString);
          
          document.getElementById('userName').textContent = user.nama || '-';
          document.getElementById('userSekolah').textContent = user.asalSekolah || '-';
          document.getElementById('userTelepon').textContent = user.nomorTelepon || '-';
          document.getElementById('userNik').textContent = user.nik || '-';
          
          const status = user.status ? String(user.status).trim() : 'Menunggu Verifikasi';
          let badgeClass = status.toLowerCase().includes('terverifikasi') ? 'status-verified' : 'status-pending';
          userStatusElement.innerHTML = `<span class="status-badge ${badgeClass}">${status}</span>`;

          passwordInput.value = user.password || 'Tidak tersedia';
          document.getElementById('pageTitle').textContent = `Halo, ${user.nama.split(' ')[0]}`;
          
      } catch (e) {
          messageArea.textContent = 'Data gagal dimuat. Mengalihkan...';
          sessionStorage.removeItem('userData');
          setTimeout(redirectToLogin, 1000);
      }
    } else {
      messageArea.textContent = 'Sesi habis. Silakan masuk kembali.';
      setTimeout(redirectToLogin, 1200);
    }
  }

  function redirectToLogin() {
    sessionStorage.removeItem('userData');
    window.location.href = '/index.html'; 
  }
</script>
</body>
</html>
