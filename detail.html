<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Akun Peserta</title>
  
  <!-- Menggunakan Tailwind CSS untuk utilitas layout dan responsif -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Poppins Font from Google Fonts for better aesthetics -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Styling Hitam & Gold */
    :root {
        --color-black: #121212;
        --color-dark-gray: #1e1e1e;
        --color-gold-primary: #FFD700; 
        --color-gold-secondary: #AA9860;
        --color-text-light: #e0e0e0;
        --color-cta-logout: #dc3545; /* Merah untuk Logout */
        --color-status-pending: #ff8c8c; /* Merah muda untuk Menunggu */
        --color-status-verified: #00ff88; /* Hijau terang untuk Terverifikasi */
    }

    body { 
      font-family: 'Poppins', sans-serif; 
      background-color: var(--color-black); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px;
    }
    
    .container { 
      background-color: var(--color-dark-gray); 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 15px 30px rgba(0,0,0,0.5); 
      width: 100%;
      max-width: 500px; 
      text-align: center; 
      border: 1px solid var(--color-gold-secondary);
    }
    
    h1 { 
      color: var(--color-gold-primary);
      margin-bottom: 5px; 
      font-size: 28px; 
      font-weight: 700; 
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    
    h2 { 
      color: var(--color-text-light); 
      margin-top: 0; 
      margin-bottom: 30px; 
      font-size: 18px; 
      font-weight: 400;
    }
    
    .announcement { 
      background-color: #333; 
      color: var(--color-gold-primary); 
      padding: 15px; 
      border-radius: 8px; 
      font-weight: bold; 
      margin-bottom: 25px; 
      border: 1px solid var(--color-gold-secondary);
    }
    
    .data-box { 
      padding: 20px; 
      border-radius: 10px; 
      background-color: #333; 
      text-align: left; 
      margin-bottom: 20px; 
      border: 1px solid #444;
    }
    
    .data-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #444;
    }
    
    .data-item:last-child {
      border-bottom: none;
    }
    
    .data-label { 
      font-weight: 600; 
      color: var(--color-gold-secondary); 
      flex-basis: 40%;
    }
    
    .data-value { 
      color: var(--color-text-light); 
      flex-basis: 60%;
      text-align: right;
      word-break: break-all;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    #userPasswordInput {
        background-color: transparent;
        border: none;
        outline: none;
        color: #ff8c8c; 
        font-family: 'monospace';
        font-size: 1rem;
        text-align: right;
        padding: 0;
        margin: 0;
        width: 100%;
        pointer-events: none;
    }
    
    .status-badge {
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 6px;
        text-transform: uppercase;
        font-size: 0.9em;
    }
    
    .status-pending {
        background-color: #581616;
        color: var(--color-status-pending);
    }
    
    .status-verified {
        background-color: #0d361f;
        color: var(--color-status-verified);
    }

    .toggle-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0 5px;
        color: var(--color-gold-primary);
        transition: color 0.2s;
    }
    
    .toggle-button:hover {
        color: white;
    }
    
    .logout-button { 
      background-color: var(--color-cta-logout); 
      color: white; 
      padding: 12px 25px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      margin-top: 15px; 
      font-size: 16px; 
      font-weight: bold; 
      transition: all 0.1s;
      width: 100%;
      box-shadow: 0 5px 0 #9f1e29;
    }
    
    .logout-button:hover { 
      background-color: #c82333; 
      box-shadow: 0 3px 0 #9f1e29;
      transform: translateY(2px);
    }

    /* Responsifitas */
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      .data-item {
        flex-direction: column;
        align-items: flex-start;
        padding: 15px 0;
      }
      .data-label {
        flex-basis: 100%;
        margin-bottom: 5px;
        color: var(--color-gold-primary);
      }
      .data-value {
        flex-basis: 100%;
        justify-content: flex-start;
        width: 100%;
      }
      #userPasswordInput {
          text-align: left;
      }
    }
  </style>
</head>
<body onload="loadUserDetails()">

<div class="container">
  <!-- Logo DPPI -->
  <div class="flex justify-center mb-6 mt-2">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png"
            alt="Logo DPPI" 
            class="h-20 w-20 rounded-full object-cover border-2 border-yellow-400"
            style="box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);"
            onerror="this.onerror=null; this.src='https://placehold.co/80x80/1A1A1A/FFD700?text=Logo';" 
      >
  </div>
    
  <h1 id="pageTitle">Detail Akun Peserta</h1>
  <h2 id="pageSubtitle">Informasi ini diambil dari data pendaftaran/login terakhir Anda.</h2>

  <div class="announcement">
    Harap simpan data NIK dan Password Anda dengan aman!
  </div>

  <div class="data-box" id="userDetails">
    <!-- Status Verifikasi -->
    <div class="data-item">
        <span class="data-label">Status Verifikasi:</span> 
        <div id="userStatus" class="data-value">
            <span class="status-badge status-pending">Memuat...</span>
        </div>
    </div>
    
    <!-- Nama Lengkap -->
    <div class="data-item">
        <span class="data-label">Nama Lengkap:</span> 
        <span id="userName" class="data-value">Memuat...</span>
    </div>
    
    <!-- Asal Sekolah -->
    <div class="data-item">
        <span class="data-label">Asal Sekolah:</span> 
        <span id="userSekolah" class="data-value">Memuat...</span>
    </div>

    <!-- Nomor Telepon -->
    <div class="data-item">
        <span class="data-label">Nomor Telepon:</span> 
        <span id="userTelepon" class="data-value">Memuat...</span>
    </div>
    
    <!-- NIK (Username) -->
    <div class="data-item">
        <span class="data-label">Username (NIK):</span> 
        <span id="userNik" class="data-value">Memuat...</span>
    </div>

    <!-- Password DENGAN TOGGLE -->
    <div class="data-item bg-red-900/10 rounded-b-lg p-3 -mx-4 -mb-4">
        <span class="data-label">Password:</span> 
        <div class="data-value">
            <input type="password" id="userPasswordInput" value="Memuat..." readonly/>
            <button class="toggle-button" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                <!-- Ikon Mata Tertutup -->
                <svg id="toggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.067 11.121A11.75 11.75 0 0 1 12.001 5.5c4.154 0 7.844 2.19 9.934 5.621m-19.868 0A11.75 11.75 0 0 0 12 18.5c4.154 0 7.844-2.19 9.934-5.621m-19.868 0L3.5 12"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
    </div>
  </div>
  
  <button class="logout-button" onclick="redirectToLogin()">LOGOUT / KEMBALI KE LOGIN</button>
  
  <!-- Area pesan jika terjadi kesalahan -->
  <div id="messageArea" style="color: #ff4757; margin-top: 10px; font-size: 0.9rem;"></div>
</div>

<script>
  // Fungsi untuk mengubah visibilitas password
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('userPasswordInput');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        // Ganti ikon menjadi Ikon Mata Tertutup (Eye-Off)
        toggleIcon.innerHTML = `
            <path d="M9.88 9.88c.18-.33.32-.63.45-.92m-.45.92-.01.01m9.62-5.74A9.76 9.76 0 0 0 12 5.5c-4.154 0-7.844 2.19-9.934 5.621m19.868 0a11.75 11.75 0 0 0-19.868 0m9.934 0a3 3 0 1 1-4.243-4.243m4.243 4.243L21 21" />
            <line x1="2" y1="2" x2="22" y2="22"></line>
        `;
    } else {
        passwordInput.type = 'password';
        // Ganti ikon menjadi Ikon Mata Terbuka (Eye)
        toggleIcon.innerHTML = `
            <path d="M2.067 11.121A11.75 11.75 0 0 1 12.001 5.5c4.154 0 7.844 2.19 9.934 5.621m-19.868 0A11.75 11.75 0 0 0 12 18.5c4.154 0 7.844-2.19 9.934-5.621m-19.868 0L3.5 12"/>
            <circle cx="12" cy="12" r="3"/>
        `;
    }
  }

  function loadUserDetails() {
    const messageArea = document.getElementById('messageArea');
    const passwordInput = document.getElementById('userPasswordInput');
    const userStatusElement = document.getElementById('userStatus');
    
    // Mengambil data pengguna dari sessionStorage yang disimpan saat login/daftar di index.html
    const userDataString = sessionStorage.getItem('userData'); 
    
    // Defaultkan status awal saat memuat
    userStatusElement.innerHTML = '<span class="status-badge status-pending">Memuat...</span>';

    if (userDataString) {
      try {
          const user = JSON.parse(userDataString);
          
          // Tampilkan data ke elemen HTML
          document.getElementById('userName').textContent = user.nama || 'Tidak ada data';
          document.getElementById('userSekolah').textContent = user.asalSekolah || 'Tidak ada data';
          document.getElementById('userTelepon').textContent = user.nomorTelepon || 'Tidak ada data';
          document.getElementById('userNik').textContent = user.nik || 'Tidak ada data';
          
          // Tampilkan Status Verifikasi
          const status = user.status ? String(user.status).trim() : 'Data Kosong';
          
          let badgeClass = 'status-pending';
          if (status.toLowerCase().includes('terverifikasi')) {
              badgeClass = 'status-verified';
          }
          
          userStatusElement.innerHTML = `<span class="status-badge ${badgeClass}">${status}</span>`;
          document.getElementById('pageSubtitle').textContent = "Detail Akun Peserta Anda.";

          // Atur nilai input password dari sesi
          if (user.password) {
              passwordInput.value = user.password;
          } else {
              passwordInput.value = 'Password tidak tersedia di sesi';
          }
          passwordInput.type = 'password';
          
          // Sesuaikan judul
          document.getElementById('pageTitle').textContent = "Selamat Datang!";
          
      } catch (e) {
          messageArea.textContent = 'Kesalahan memproses data sesi. Mengalihkan ke login...';
          console.error('Error parsing user data:', e);
          sessionStorage.removeItem('userData');
          setTimeout(redirectToLogin, 1000);
      }
    } else {
      // Jika data tidak ada (user belum login), arahkan ke index.html
      passwordInput.value = 'Memuat...';
      messageArea.textContent = 'Sesi tidak ditemukan. Mengalihkan ke halaman login...';
      setTimeout(redirectToLogin, 1000);
    }
  }

  function redirectToLogin() {
    // Menghapus sesi sebelum mengalihkan
    sessionStorage.removeItem('userData');
    
    // Arahkan kembali ke halaman index Vercel
    window.location.href = '/index.html'; 
  }
</script>

</body>
</html>
