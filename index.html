<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pendaftaran - BHINNEKASTRA & TRIPATI DPPI 2026</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/a/a0/Logo_dppi_512.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg-main: #F9F1E2;
      --bg-card: #FFFFFF;
      --bg-item: #EFE4D2;
      --color-primary: #A3496C;
      --color-primary-hover: #853A55;
      --text-main: #543A2A;
      --text-muted: #886144;
      --border-color: #DFBE8D;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-image: radial-gradient(circle at 50% 0%, rgba(163, 73, 108, 0.14) 0%, transparent 60%);
      box-sizing: border-box;
    }

    .portal-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 520px;
      border-radius: 32px;
      padding: 36px 28px;
      box-shadow: 0 18px 40px rgba(84, 58, 42, 0.09);
      border: 1px solid var(--border-color);
      margin: 0 auto;
    }

    .top-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      transform: scale(1.7);
      margin-bottom: 10px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg-item);
      padding: 5px;
      border-radius: 100px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      padding: 11px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .auth-tab-btn.active {
      background: linear-gradient(135deg, #A3496C 0%, #853A55 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(163, 73, 108, 0.28);
    }

    /* Pilihan Program Bhinnekastra / Tripati */
    .program-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .program-option {
      position: relative;
      background: #faf7f2;
      border: 2px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .program-option:hover {
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }

    .program-option.selected-bhinnekastra {
      background: linear-gradient(135deg, #FFF7FA 0%, #F9ECF1 100%);
      border-color: #A3496C;
      box-shadow: 0 8px 20px rgba(163, 73, 108, 0.16);
    }

    .program-option.selected-tripati {
      background: linear-gradient(135deg, #2D1E19 0%, #160F0C 100%);
      border-color: #C8963E;
      color: #F4D77D;
      box-shadow: 0 10px 24px rgba(22, 15, 12, 0.25);
    }

    .program-option.selected-tripati .prog-sub {
      color: #D5B992;
    }

    .program-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.2s ease;
    }

    .program-option.selected-bhinnekastra .program-check {
      background: #A3496C;
      color: #fff;
      opacity: 1;
      transform: scale(1);
    }

    .program-option.selected-tripati .program-check {
      background: #C8963E;
      color: #160F0C;
      opacity: 1;
      transform: scale(1);
    }

    /* Field Input */
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: #faf7f2;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background: #FFFFFF;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(163, 73, 108, 0.12);
    }

    .kabupaten-box {
      background: linear-gradient(135deg, #FFFBF2 0%, #F7EBDA 100%);
      border: 1.5px solid #C8963E;
      border-radius: 18px;
      padding: 14px;
      animation: slideDown 0.28s ease forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #A3496C 0%, #853A55 100%);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 22px rgba(163, 73, 108, 0.26);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(163, 73, 108, 0.36);
    }

    .btn-primary.tripati-mode {
      background: linear-gradient(135deg, #2D1E19 0%, #160F0C 100%);
      color: #F4D77D;
      border: 1px solid #C8963E;
      box-shadow: 0 10px 24px rgba(22, 15, 12, 0.28);
    }

    .file-card {
      background: #faf7f2;
      border: 1px dashed var(--border-color);
      border-radius: 14px;
      padding: 12px;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="flex flex-col items-center text-center mb-6">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png" alt="Logo DPPI" class="top-logo">
      <h1 class="text-xl font-extrabold text-[#A3496C] tracking-tight">Portal DPPI Kota Yogyakarta</h1>
      <p class="text-xs text-[#886144] mt-1">Pendaftaran Resmi Bhinnekastra & Tripati 2026</p>
    </div>

    <!-- Tab Login / Daftar -->
    <div class="auth-tabs">
      <button type="button" id="btnTabLogin" class="auth-tab-btn active" onclick="switchAuthTab('login')">
        <i class="fas fa-sign-in-alt mr-1.5"></i> Masuk Akun
      </button>
      <button type="button" id="btnTabRegister" class="auth-tab-btn" onclick="switchAuthTab('register')">
        <i class="fas fa-user-plus mr-1.5"></i> Daftar Baru
      </button>
    </div>

    <!-- ==================== FORM LOGIN ==================== -->
    <div id="sectionLogin">
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="loginNik" class="form-label">Nomor Induk Kependudukan (NIK)</label>
          <input type="text" id="loginNik" class="form-input" placeholder="Masukkan 16 digit NIK" required>
        </div>
        <div>
          <label for="loginPass" class="form-label">Kata Sandi</label>
          <div class="relative">
            <input type="password" id="loginPass" class="form-input pr-11" placeholder="Masukkan kata sandi" required>
            <button type="button" onclick="togglePassField('loginPass', 'iconLoginPass')"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#886144] hover:text-[#A3496C]">
              <i id="iconLoginPass" class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary mt-2">
          <i class="fas fa-arrow-right-to-bracket mr-2"></i> Masuk ke Dashboard
        </button>
      </form>
    </div>

    <!-- ==================== FORM PENDAFTARAN ==================== -->
    <div id="sectionRegister" class="hidden">
      <form id="registerForm" class="space-y-4">
        <input type="hidden" id="regProgram" value="Bhinnekastra">

        <!-- Pilihan Program Bhinnekastra atau Tripati -->
        <div>
          <label class="form-label text-center mb-2">Pilih Program Pendaftaran <span class="text-red-500">*</span></label>
          <div class="program-grid">
            <div id="optBhinnekastra" class="program-option selected-bhinnekastra" onclick="selectProgram('Bhinnekastra')">
              <span class="program-check"><i class="fas fa-check"></i></span>
              <div class="w-10 h-10 rounded-full bg-[#A3496C]/15 text-[#A3496C] flex items-center justify-center mx-auto mb-2">
                <i class="fas fa-flag"></i>
              </div>
              <p class="font-extrabold text-sm">BHINNEKASTRA</p>
              <p class="prog-sub text-[10px] text-[#886144] mt-0.5">Program Seleksi Utama</p>
            </div>

            <div id="optTripati" class="program-option" onclick="selectProgram('Tripati')">
              <span class="program-check"><i class="fas fa-check"></i></span>
              <div class="w-10 h-10 rounded-full bg-[#C8963E]/20 text-[#C8963E] flex items-center justify-center mx-auto mb-2">
                <i class="fas fa-award"></i>
              </div>
              <p class="font-extrabold text-sm">TRIPATI</p>
              <p class="prog-sub text-[10px] text-[#886144] mt-0.5">Program Evaluasi & CAT</p>
            </div>
          </div>
        </div>

        <!-- Kolom Tambahan Khusus TRIPATI: Asal Kabupaten -->
        <div id="kabupatenFieldBox" class="kabupaten-box hidden">
          <label for="regKabupaten" class="form-label text-[#543A2A] flex items-center gap-1.5">
            <i class="fas fa-map-marker-alt text-[#C8963E]"></i>
            <span>Asal Kabupaten / Kota (Khusus Tripati) <span class="text-red-600">*</span></span>
          </label>
          <input type="text" id="regKabupaten" list="daftarKabupaten" class="form-input bg-white"
            placeholder="Pilih atau ketik Asal Kabupaten (Contoh: Kabupaten Sleman)">
          <datalist id="daftarKabupaten">
            <option value="Kota Yogyakarta">
            <option value="Kabupaten Sleman">
            <option value="Kabupaten Bantul">
            <option value="Kabupaten Kulon Progo">
            <option value="Kabupaten Gunungkidul">
          </datalist>
          <p class="text-[11px] text-[#886144] mt-1.5">Wajib diisi bagi pendaftar program Tripati.</p>
        </div>

        <!-- Biodata Peserta -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label for="regNik" class="form-label">NIK <span class="text-red-500">*</span></label>
            <input type="text" id="regNik" class="form-input" placeholder="16 digit NIK" required>
          </div>
          <div>
            <label for="regNama" class="form-label">Nama Lengkap <span class="text-red-500">*</span></label>
            <input type="text" id="regNama" class="form-input" placeholder="Sesuai identitas" required>
          </div>
        </div>

        <div>
          <label for="regSekolah" class="form-label">Asal Sekolah / Instansi <span class="text-red-500">*</span></label>
          <input type="text" id="regSekolah" class="form-input" placeholder="Contoh: SMAN 2 YOGYAKARTA" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label for="regWa" class="form-label">No. WhatsApp Aktif <span class="text-red-500">*</span></label>
            <input type="tel" id="regWa" class="form-input" placeholder="08xxxxxxxxxx" required>
          </div>
          <div>
            <label for="regJk" class="form-label">Jenis Kelamin <span class="text-red-500">*</span></label>
            <select id="regJk" class="form-input" required>
              <option value="">-- Pilih --</option>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
        </div>

        <div>
          <label for="regTtl" class="form-label">Tempat, Tanggal Lahir <span class="text-red-500">*</span></label>
          <input type="text" id="regTtl" class="form-input" placeholder="Contoh: Yogyakarta, 17 Agustus 2010" required>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label for="regUsia" class="form-label">Usia (Thn) <span class="text-red-500">*</span></label>
            <input type="number" id="regUsia" class="form-input" placeholder="16" min="10" max="30" required>
          </div>
          <div>
            <label for="regTinggi" class="form-label">Tinggi (cm) <span class="text-red-500">*</span></label>
            <input type="number" id="regTinggi" class="form-input" placeholder="168" required>
          </div>
          <div>
            <label for="regBerat" class="form-label">Berat (kg) <span class="text-red-500">*</span></label>
            <input type="number" id="regBerat" class="form-input" placeholder="58" required>
          </div>
        </div>

        <div>
          <label for="regPass" class="form-label">Buat Kata Sandi Akun <span class="text-red-500">*</span></label>
          <div class="relative">
            <input type="password" id="regPass" class="form-input pr-11" placeholder="Minimal 6 karakter" minlength="6" required>
            <button type="button" onclick="togglePassField('regPass', 'iconRegPass')"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#886144] hover:text-[#A3496C]">
              <i id="iconRegPass" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Upload Berkas -->
        <div class="space-y-3 pt-1">
          <div class="file-card">
            <label for="regFileBukti" class="form-label">Kartu Pelajar / Identitas (Max 3MB) <span class="text-red-500">*</span></label>
            <input type="file" id="regFileBukti" accept="image/*,.pdf" required class="w-full text-xs text-[#543A2A] cursor-pointer">
          </div>
          <div class="file-card">
            <label for="regFileIG" class="form-label">Bukti Follow IG @dppi.kotayogyakarta (Max 3MB) <span class="text-red-500">*</span></label>
            <input type="file" id="regFileIG" accept="image/*" required class="w-full text-xs text-[#543A2A] cursor-pointer">
          </div>
          <div class="file-card">
            <label for="regFileTikTok" class="form-label">Bukti Follow TikTok @dppi.kotayogyakarta (Max 3MB) <span class="text-red-500">*</span></label>
            <input type="file" id="regFileTikTok" accept="image/*" required class="w-full text-xs text-[#543A2A] cursor-pointer">
          </div>
        </div>

        <button type="submit" id="btnSubmitRegister" class="btn-primary mt-2">
          <i class="fas fa-paper-plane mr-2"></i> Daftar Program Bhinnekastra
        </button>
      </form>
    </div>

    <p class="text-center text-[11px] text-[#886144]/70 mt-6 font-medium">
      &copy; 2026 DPPI Kota Yogyakarta
    </p>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP TERBARU HASIL DEPLOY kode.gs
    const gasUrl = 'https://script.google.com/macros/s/AKfycbwoGe8hzgF6Z3YUXHDkE1RurNFeImsVeox7WQvmbUnTGPwskQP3PDZVsRIkXj61UNF_/exec';

    function switchAuthTab(mode) {
      const isLogin = mode === 'login';
      document.getElementById('sectionLogin').classList.toggle('hidden', !isLogin);
      document.getElementById('sectionRegister').classList.toggle('hidden', isLogin);
      document.getElementById('btnTabLogin').classList.toggle('active', isLogin);
      document.getElementById('btnTabRegister').classList.toggle('active', !isLogin);
    }

    function selectProgram(program) {
      document.getElementById('regProgram').value = program;
      const optBhinn = document.getElementById('optBhinnekastra');
      const optTrip = document.getElementById('optTripati');
      const kabBox = document.getElementById('kabupatenFieldBox');
      const kabInput = document.getElementById('regKabupaten');
      const btnSubmit = document.getElementById('btnSubmitRegister');

      optBhinn.classList.remove('selected-bhinnekastra');
      optTrip.classList.remove('selected-tripati');

      if (program === 'Tripati') {
        optTrip.classList.add('selected-tripati');
        kabBox.classList.remove('hidden');
        kabInput.required = true;
        btnSubmit.classList.add('tripati-mode');
        btnSubmit.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Daftar Program Tripati';
        setTimeout(() => kabInput.focus(), 100);
      } else {
        optBhinn.classList.add('selected-bhinnekastra');
        kabBox.classList.add('hidden');
        kabInput.required = false;
        kabInput.value = '';
        btnSubmit.classList.remove('tripati-mode');
        btnSubmit.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Daftar Program Bhinnekastra';
      }
    }

    function togglePassField(inputId, iconId) {
      const el = document.getElementById(inputId);
      const ic = document.getElementById(iconId);
      if (el.type === 'password') {
        el.type = 'text';
        ic.className = 'fas fa-eye-slash';
      } else {
        el.type = 'password';
        ic.className = 'fas fa-eye';
      }
    }

    function readFileToBase64(inputId) {
      return new Promise((resolve, reject) => {
        const input = document.getElementById(inputId);
        const file = input && input.files ? input.files[0] : null;
        if (!file) return reject(new Error('Semua berkas wajib diunggah.'));
        if (file.size > 3 * 1024 * 1024) return reject(new Error(`Ukuran file "${file.name}" melebihi batas maksimal 3 MB.`));
        const reader = new FileReader();
        reader.onload = (e) => resolve({
          base64: e.target.result.split(',')[1],
          mimeType: file.type,
          name: file.name
        });
        reader.onerror = () => reject(new Error('Gagal membaca file ' + file.name));
        reader.readAsDataURL(file);
      });
    }

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nik = document.getElementById('loginNik').value.trim();
      const password = document.getElementById('loginPass').value.trim();

      Swal.fire({ title: 'Memverifikasi...', text: 'Mohon tunggu sebentar...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        const response = await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', nik, password })
        });
        const result = await response.json();

        if (result.success) {
          sessionStorage.setItem('userData', JSON.stringify({ ...result.data, password }));
          Swal.fire({ icon: 'success', title: 'Login Berhasil!', text: 'Mengalihkan ke halaman profil...', timer: 1200, showConfirmButton: false })
            .then(() => { window.location.href = 'detail.html'; });
        } else {
          Swal.fire('Gagal Masuk', result.message || 'NIK atau Kata Sandi salah.', 'error');
        }
      } catch (err) {
        Swal.fire('Koneksi Gagal', 'Tidak dapat terhubung ke server.', 'error');
      }
    });

    // PENDAFTARAN
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const program = document.getElementById('regProgram').value;
      const asalKabupaten = document.getElementById('regKabupaten').value.trim();

      if (program === 'Tripati' && !asalKabupaten) {
        return Swal.fire('Lengkapi Data', 'Asal Kabupaten wajib diisi untuk pendaftaran Tripati.', 'warning');
      }

      Swal.fire({
        title: `Mendaftar Program ${program}...`,
        text: 'Sedang mengunggah berkas & menyimpan data. Mohon jangan tutup halaman ini.',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const [bukti, ig, tiktok] = await Promise.all([
          readFileToBase64('regFileBukti'),
          readFileToBase64('regFileIG'),
          readFileToBase64('regFileTikTok')
        ]);

        const payload = {
          action: 'register',
          program: program,
          asalKabupaten: program === 'Tripati' ? asalKabupaten : '-',
          nik: document.getElementById('regNik').value.trim(),
          nama: document.getElementById('regNama').value.trim(),
          asalSekolah: document.getElementById('regSekolah').value.trim(),
          nomorTelepon: document.getElementById('regWa').value.trim(),
          jenisKelamin: document.getElementById('regJk').value,
          tempatLahir: document.getElementById('regTtl').value.trim(),
          usia: document.getElementById('regUsia').value.trim(),
          tinggi: document.getElementById('regTinggi').value.trim(),
          berat: document.getElementById('regBerat').value.trim(),
          password: document.getElementById('regPass').value.trim(),
          fileBase64: bukti.base64,
          fileMimeType: bukti.mimeType,
          fileName: bukti.name,
          fileIGBase64: ig.base64,
          fileIGMimeType: ig.mimeType,
          fileIGName: ig.name,
          fileTikTokBase64: tiktok.base64,
          fileTikTokMimeType: tiktok.mimeType,
          fileTikTokName: tiktok.name
        };

        const response = await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.success) {
          sessionStorage.setItem('userData', JSON.stringify(result.data));
          Swal.fire({
            icon: 'success',
            title: 'Pendaftaran Berhasil!',
            text: `Data pendaftaran program ${program} Anda telah tersimpan.`,
            confirmButtonColor: '#A3496C'
          }).then(() => {
            window.location.href = 'detail.html';
          });
        } else {
          Swal.fire('Pendaftaran Gagal', result.message || 'Terjadi kesalahan saat mendaftar.', 'error');
        }
      } catch (err) {
        Swal.fire('Gagal', err.message || 'Terjadi kesalahan koneksi.', 'error');
      }
    });
  </script>
</body>
</html>
