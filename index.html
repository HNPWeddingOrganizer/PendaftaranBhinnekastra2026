<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PENDAFTARAN AKUN TRIPATI DPPI KOTA YOGYAKARTA 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    
    :root {
        --color-black: #1A1A1A;
        --color-dark-gray: #2D2D2D;
        --color-gold-primary: #FFD700; 
        --color-gold-secondary: #B8860B; 
        --color-cta-register: #007bff; 
        --color-cta-register-shadow: #0056b3; 
        --color-error: #ff4757;
        --color-success: #2ed573;
    }

    body {
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background-color: var(--color-black); 
      color: #F0F0F0;
    }
    
    .animated-bg { background: var(--color-black); position: relative; }
    
    .shape {
      position: absolute; border-radius: 50%; filter: blur(50px); 
      opacity: 0.2; animation: float 25s infinite; z-index: 0;
    }
    .shape-1 { width: 400px; height: 400px; background: var(--color-gold-primary); top: -150px; left: -150px; animation-delay: 0s; }
    .shape-2 { width: 350px; height: 350px; background: var(--color-gold-secondary); bottom: -100px; right: -100px; animation-delay: 5s; }
    .shape-3 { width: 300px; height: 300px; background: #FFECB3; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 10s; }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(40px, -40px) rotate(100deg); }
      66% { transform: translate(-30px, 30px) rotate(200deg); }
    }
    
    .glass-card {
      background: rgba(42, 42, 42, 0.7); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.3); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .input-wrapper { position: relative; overflow: visible; }
    
    .input-icon {
      position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--color-gold-primary) 0%, var(--color-gold-secondary) 100%); 
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; z-index: 10; pointer-events: none;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
    }
    
    .password-toggle {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        cursor: pointer; z-index: 20; color: var(--color-gold-primary);
        padding: 5px; transition: color 0.2s;
    }
    .password-toggle:hover { color: #fff; }

    .input-field {
      background-color: #2D2D2D !important; color: #F0F0F0; border: 2px solid #3A3A3A !important;
      transition: all 0.3s ease; padding-right: 1rem !important; padding-left: 64px !important;
    }
    
    #loginPassword, #daftarPassword { padding-right: 40px !important; }
    .input-field::placeholder { color: #A0A0A0; }
    .input-field:focus {
      transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 215, 0, 0.2); 
      border-color: var(--color-gold-primary) !important;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--color-gold-primary) 0%, var(--color-gold-secondary) 100%); 
      color: var(--color-black) !important; position: relative; overflow: hidden;
      transition: all 0.3s ease; box-shadow: 0 6px 0 var(--color-gold-secondary); 
      padding: 12px; border-radius: 8px; font-weight: bold;
    }
    .btn-primary::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); transition: left 0.5s;
    }
    .btn-primary:hover::before { left: 100%; }
    .btn-primary:hover {
      transform: translateY(-2px); box-shadow: 0 4px 0 var(--color-gold-secondary), 0 15px 35px rgba(255, 215, 0, 0.5); 
    }

    .btn-register { 
        background-color: var(--color-cta-register); color: white !important; 
        box-shadow: 0 6px 0 var(--color-cta-register-shadow); width: 100%; 
        padding: 12px; border: none; border-radius: 8px; cursor: pointer; 
        font-size: 16px; font-weight: bold; transition: all 0.1s;
        position: relative; overflow: hidden;
    }
    .btn-register:hover { 
        background-color: var(--color-cta-register-shadow); box-shadow: 0 4px 0 var(--color-cta-register-shadow);
        transform: translateY(2px);
    }
    .btn-register::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); transition: left 0.5s;
    }
    .btn-register:hover::before { left: 100%; }
    
    .btn-loading { background-color: #555 !important; pointer-events: none; cursor: not-allowed; box-shadow: none !important; transform: none !important; opacity: 0.7; }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }

    .gold-text-gradient {
      background: linear-gradient(135deg, var(--color-gold-primary) 30%, var(--color-gold-secondary) 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; color: transparent;
    }

    .message { 
        margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; 
        display: flex; align-items: center; justify-content: center;
        font-weight: 600; transition: all 0.3s ease; opacity: 0; transform: translateY(10px);
    }
    .message.show { opacity: 1; transform: translateY(0); }
    .message-icon { margin-right: 10px; width: 24px; height: 24px; }
    .success { background-color: #3c5440; color: var(--color-success); border: 2px solid var(--color-success); }
    .error { background-color: #721c24; color: var(--color-error); border: 2px solid var(--color-error); }
    
    .tab { border: none; }
    .tab button { 
      background-color: rgba(42, 42, 42, 0.9); color: #A0A0A0; flex-grow: 1;
      padding: 12px 15px; border: none; transition: 0.3s; font-weight: 500;
    }
    .tab button.active { 
      background-color: var(--color-gold-primary); color: var(--color-black); 
      font-weight: bold; border-radius: 6px; box-shadow: 0 4px 10px rgba(255, 215, 0, 0.4);
    }
    .tab button:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
    .tab button:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

    .tabcontent { display: none; padding: 10px 0; }
    .tabcontent.active { display: block; }
    .icon-color { stroke: var(--color-black); }
  </style>
</head>

<body class="animated-bg min-h-screen flex items-center justify-center">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="glass-card p-8 md:p-10 w-full max-w-md form-container z-10 rounded-xl">
        <div class="flex justify-center mb-6 mt-2">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Logo_DPPI.png"
                 alt="Logo Ujian PIP" 
                 class="h-32 w-32 rounded-full object-cover border-4 border-yellow-400"
                 style="box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);"
                 onerror="this.onerror=null; this.src='https://placehold.co/120x120/1A1A1A/FFD700?text=Logo+DPPI';" >
        </div>

        <h2 class="text-3xl font-bold mb-6 text-center gold-text-gradient">
            PENDAFTARAN TRIPATI 2025
        </h2>

        <div class="tab flex space-x-2 mb-4">
            <button class="tablinks active" onclick="openTab(event, 'Login')">Masuk (Login)</button>
            <button class="tablinks" onclick="openTab(event, 'Daftar')">Daftar Akun</button>
        </div>

        <div id="Login" class="tabcontent active">
            <form id="loginForm">
                <label for="loginNik" class="text-sm font-medium text-gray-300">NIK (Username)</label>
                <div class="input-wrapper my-2">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-color lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <input type="text" placeholder="Masukkan NIK Anda" name="nik" required id="loginNik" class="input-field w-full py-3 px-4 rounded-lg text-lg">
                </div>

                <label for="loginPassword" class="text-sm font-medium text-gray-300">Password</label>
                <div class="input-wrapper my-2">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-color lucide lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <input type="password" placeholder="Masukkan Password" name="password" required id="loginPassword" class="input-field w-full py-3 px-4 rounded-lg text-lg">
                    <span class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)">
                        <svg id="loginEyeClosed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c.76 0 1.51.1 2.24.28"/><path d="M14.24 14.24a3 3 0 0 0-4.24-4.24"/><path d="M16.94 16.94A10.5 10.5 0 0 1 12 19c-.76 0-1.51-.1-2.24-.28"/><path d="M10.73 18.92c-.73.18-1.5.28-2.24.28a10.43 10.43 0 0 1-5.27-1.78l-1.72-1.72"/><path d="M2 2l20 20"/><path d="M5.08 10.73c-.18.73-.28 1.5-.28 2.27a10.43 10.43 0 0 0 1.78 5.27l1.72 1.72"/></svg>
                    </span>
                </div>
                
                <button type="submit" id="btnLogin" class="btn-primary w-full mt-4 text-xl flex items-center justify-center">
                    <svg class="spinner -ml-1 mr-2 h-5 w-5 text-black hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span class="btn-text">LOGIN</span>
                </button>
                <div id="loginMessage" class="message"></div>
            </form>
        </div>

        <div id="Daftar" class="tabcontent">
            <form id="daftarForm">
                <label for="daftarNik" class="text-sm font-medium text-gray-300">NIK (Username)</label>
                <div class="input-wrapper my-2">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-color lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <input type="text" placeholder="NIK" name="nik" required id="daftarNik" class="input-field w-full py-3 px-4 rounded-lg text-lg">
                </div>

                <label for="daftarPassword" class="text-sm font-medium text-gray-300">Password</label>
                <div class="input-wrapper my-2">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-color lucide lucide-key"><path d="m21.79 6.21-3.6-3.6a4 4 0 0 0-5.66 0L1 14.86a2 2 0 0 0 0 2.83l3.6 3.6a4 4 0 0 0 5.66 0L21.79 6.21z"/><circle cx="13" cy="11" r="2"/></svg>
                    </div>
                    <input type="password" placeholder="Password Anda (Min. 6 karakter)" name="password" required id="daftarPassword" class="input-field w-full py-3 px-4 rounded-lg text-lg">
                    <span class="password-toggle" onclick="togglePasswordVisibility('daftarPassword', this)">
                        <svg id="daftarEyeClosed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c.76 0 1.51.1 2.24.28"/><path d="M14.24 14.24a3 3 0 0 0-4.24-4.24"/><path d="M16.94 16.94A10.5 10.5 0 0 1 12 19c-.76 0-1.51-.1-2.24-.28"/><path d="M10.73 18.92c-.73.18-1.5.28-2.24.28a10.43 10.43 0 0 1-5.27-1.78l-1.72-1.72"/><path d="M2 2l20 20"/><path d="M5.08 10.73c-.18.73-.28 1.5-.28 2.27a10.43 10.43 0 0 0 1.78 5.27l1.72 1.72"/></svg>
                    </span>
                </div>
                
                <label for="daftarNama" class="text-sm font-medium text-gray-300">Nama Lengkap</label>
                <div class="input-wrapper my-2">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-color lucide lucide-user-check"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 17 2 2 4-4"/></svg>
                    </div>
                    <input type="text" placeholder="Nama Lengkap" name="nama" required id="daftarNama" class="input-field w-full py-3 px-4 rounded-lg text-lg">
                </div>

                <label for="daftarSekolah" class="text-sm font-medium text-gray-300">Asal Sekolah</label>
                <div class="input-wrapper my-2">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-color lucide lucide-graduation-cap"><path d="M22 10v6M10 21h4c.7 0 1.4-.3 2-1l1-2V13c0-.4-.1-.8-.4-1.1L15.3 8.3c-.4-.4-.7-.7-1.3-.7H9.7c-.6 0-1 .3-1.3.7L5.4 11.9c-.3.3-.4.7-.4 1.1v4c0 .7.3 1.4 1 2l1 2c.6.7 1.3 1 2 1h4z"/><path d="m14 16 1-2v-4"/><path d="m10 16 1-2v-4"/><path d="M22 10v6l-1 2c-.6.7-1.3 1-2 1h-4"/></svg>
                    </div>
                    <input type="text" placeholder="Nama Sekolah Anda" name="asalSekolah" required id="daftarSekolah" class="input-field w-full py-3 px-4 rounded-lg text-lg">
                </div>

                <label for="daftarTelepon" class="text-sm font-medium text-gray-300">Nomor Telepon</label>
                <div class="input-wrapper my-2">
                    <div class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-color lucide lucide-phone"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.08 2h3a2 2 0 0 1 2 1.72 17.5 17.5 0 0 0 .97 4.15 2 2 0 0 1-.45 2.11L8.09 13.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 17.5 17.5 0 0 0 4.15.97A2 2 0 0 1 22 16.92z"/></svg>
                    </div>
                    <input type="text" placeholder="Cth: 081234567890" name="nomorTelepon" required id="daftarTelepon" class="input-field w-full py-3 px-4 rounded-lg text-lg">
                </div>
                
                <label for="fileBukti" class="text-sm font-medium text-gray-300 mt-4 block">Bukti Kartu Pelajar/SK Kelas X (Wajib)</label>
                <input type="file" name="fileBukti" required id="fileBukti" accept=".jpg,.jpeg,.png,.pdf" class="w-full py-3 px-1 rounded-lg text-lg border-2 border-dashed border-gray-600/50 bg-gray-700/30 text-gray-300">
                
                <button type="submit" id="btnDaftar" class="btn-register w-full mt-6 text-xl flex items-center justify-center">
                    <svg class="spinner -ml-1 mr-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span class="btn-text">DAFTAR SEKARANG</span>
                </button>
                <div id="daftarMessage" class="message"></div>
            </form>
        </div>
    </div>

<script>
  // MASUKKAN URL GOOGLE APPS SCRIPT WEB APP ANDA DI SINI
  const gasBaseUrl = 'https://script.google.com/macros/s/XXXXX_GANTI_DENGAN_URL_ANDA_XXXXX/exec';

  function showMessage(element, type, message) {
    let icon = type === 'success' ? '✅ ' : '❌ ';
    element.className = 'message ' + type + ' show';
    element.innerHTML = `<span>${icon} ${message}</span>`;
  }
  
  function togglePasswordVisibility(inputId, toggleElement) {
    const passwordInput = document.getElementById(inputId);
    passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
  }
  window.togglePasswordVisibility = togglePasswordVisibility; 

  function openTab(evt, tabName) {
    document.querySelectorAll('.tabcontent').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tablinks').forEach(tab => tab.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    evt.currentTarget.classList.add("active");
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('userData')) {
        window.location.href = '/detail.html'; 
        return;
    }
  });
  
  function setButtonLoading(button, isLoading, originalText, loadingText) {
      const spinner = button.querySelector('.spinner');
      const textSpan = button.querySelector('.btn-text');
      button.disabled = isLoading;
      button.classList.toggle('btn-loading', isLoading);
      if (spinner) spinner.classList.toggle('hidden', !isLoading);
      if (textSpan) textSpan.textContent = isLoading ? loadingText : originalText;
  }

  document.getElementById('daftarForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btnDaftar = document.getElementById('btnDaftar');
    const messageDiv = document.getElementById('daftarMessage');
    const fileInput = document.getElementById('fileBukti');
    const passwordInput = document.getElementById('daftarPassword').value;

    if (passwordInput.length < 6) return showMessage(messageDiv, "error", "Password minimal 6 karakter.");
    if (fileInput.files.length === 0) return showMessage(messageDiv, "error", "Bukti Kartu Pelajar wajib diunggah.");
    
    setButtonLoading(btnDaftar, true, 'DAFTAR SEKARANG', 'Mengirim data...');

    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onload = async function(event) {
        const base64Data = event.target.result.split(',')[1];
        const payload = {
            action: 'register',
            nik: document.getElementById('daftarNik').value,
            password: passwordInput,
            nama: document.getElementById('daftarNama').value,
            asalSekolah: document.getElementById('daftarSekolah').value,
            nomorTelepon: document.getElementById('daftarTelepon').value,
            fileName: file.name,
            fileMimeType: file.type,
            fileBase64: base64Data
        };

        try {
            const response = await fetch(gasBaseUrl, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();
            setButtonLoading(btnDaftar, false, 'DAFTAR SEKARANG');
            
            if (result.success) {
                showMessage(messageDiv, "success", result.message);
                const userData = { ...result.data, password: passwordInput };
                sessionStorage.setItem('userData', JSON.stringify(userData));
                setTimeout(() => { window.location.href = '/detail.html'; }, 500); 
            } else {
                showMessage(messageDiv, "error", result.message);
            }
        } catch (error) {
            setButtonLoading(btnDaftar, false, 'DAFTAR SEKARANG');
            showMessage(messageDiv, "error", "Terjadi kesalahan koneksi server.");
        }
    };
    reader.readAsDataURL(file);
  });
  
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btnLogin = document.getElementById('btnLogin');
    const messageDiv = document.getElementById('loginMessage');
    
    const payload = {
      action: 'login',
      nik: document.getElementById('loginNik').value.trim(),
      password: document.getElementById('loginPassword').value
    };

    setButtonLoading(btnLogin, true, 'LOGIN', 'Memverifikasi...');

    try {
        const response = await fetch(gasBaseUrl, { method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();
        setButtonLoading(btnLogin, false, 'LOGIN');

        if (result.success) {
            showMessage(messageDiv, "success", result.message);
            const userData = { ...result.data, password: payload.password };
            sessionStorage.setItem('userData', JSON.stringify(userData));
            setTimeout(() => { window.location.href = '/detail.html'; }, 500); 
        } else {
            showMessage(messageDiv, "error", result.message);
        }
    } catch (error) {
        setButtonLoading(btnLogin, false, 'LOGIN');
        showMessage(messageDiv, "error", "Gagal menghubungi server.");
    }
  });
</script>
</body>
</html>
